<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="common.css">
<style>
  /* GUESS THE PLAYER: a scouting file on a blueprint grid. Clues type in one at a time, hardest first. */
  #stage { background: #08101c; }
  #grid { position: absolute; inset: -120px; background-image:
            linear-gradient(rgba(255,214,10,.07) 2px, transparent 2px), linear-gradient(90deg, rgba(255,214,10,.07) 2px, transparent 2px),
            linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
          background-size: 120px 120px, 120px 120px, 30px 30px, 30px 30px; }
  #vig { position: absolute; inset: 0; background: radial-gradient(80% 60% at 50% 45%, transparent 40%, rgba(3,5,9,.85) 100%); }
  #sport { top: 92px; }
  #title { position: absolute; left: 0; right: 0; top: 160px; text-align: center; font-size: 132px; line-height: 1; letter-spacing: 3px; }
  #title b { color: #ffd60a; font-weight: normal; }
  #sub { position: absolute; left: 0; right: 0; top: 304px; text-align: center; font-size: 34px; color: #8a96ab; }
  /* the file: a mystery photo and the clues-used meter */
  #file { position: absolute; left: 90px; right: 90px; top: 380px; height: 250px; }
  #photo { position: absolute; left: 0; top: 0; width: 230px; height: 250px; border-radius: 22px; background: #111a29;
           box-shadow: inset 0 0 0 5px #2a3854; overflow: hidden; }
  #photo svg { position: absolute; left: 15px; bottom: -6px; }
  #photo .q { position: absolute; left: 0; right: 0; top: 18px; text-align: center; font-size: 150px; color: #ffd60a;
              text-shadow: 0 8px 30px #000; }
  #photo .tape { position: absolute; left: -30px; top: 186px; width: 300px; height: 44px; background: #ffd60a; transform: rotate(-8deg);
                 color: #07090d; font-size: 26px; font-weight: 800; text-align: center; line-height: 44px; letter-spacing: 6px; }
  #meter { position: absolute; left: 270px; right: 0; top: 18px; }
  #meter .lbl { font-size: 32px; color: #8a96ab; }
  #meter .num { font-size: 120px; line-height: 1.05; margin-top: 4px; }
  #meter .num b { color: #ffd60a; font-weight: normal; }
  #pips { display: flex; gap: 14px; margin-top: 8px; }
  #pips i { display: block; height: 26px; flex: 1; border-radius: 13px; background: #1c2638; box-shadow: inset 0 0 0 3px #2a3854; }
  #pips i.on { background: #ffd60a; box-shadow: 0 0 22px rgba(255,214,10,.5); }
  /* the clues */
  #clues { position: absolute; left: 90px; right: 90px; top: 676px; height: 724px; }
  .clue { position: absolute; left: 0; right: 0; border-radius: 22px; background: #101827; box-shadow: inset 0 0 0 4px #223049;
          display: flex; align-items: center; gap: 26px; padding: 0 30px 0 22px; box-sizing: border-box; }
  .clue .n { flex: none; width: 88px; height: 88px; border-radius: 18px; background: #1c2638; color: #56647d; display: flex;
             align-items: center; justify-content: center; font-size: 60px; }
  .clue.on .n { background: #ffd60a; color: #07090d; }
  .clue .txt { flex: 1; height: 100%; padding: 10px 0; justify-content: flex-start; text-align: left; color: #f4f1ea; line-height: 1.06; }
  .clue .lock { position: absolute; left: 136px; font-size: 32px; color: #3a4862; letter-spacing: 6px; }
  .clue.new { box-shadow: inset 0 0 0 5px #ffd60a, 0 0 40px rgba(255,214,10,.25); }
  .clue .txt i { font-style: normal; opacity: 0; }
  /* comment prompt, then the payoff */
  #prompt { position: absolute; left: 50%; top: 1436px; transform: translateX(-50%); white-space: nowrap; background: #ffd60a; color: #07090d;
            font-size: 58px; padding: 12px 46px; border-radius: 80px; letter-spacing: 3px; }
  /* the reveal */
  #name { position: absolute; left: 60px; right: 60px; top: 372px; height: 230px; color: #ffd60a; line-height: .98; letter-spacing: 2px;
          text-shadow: 0 10px 40px rgba(0,0,0,.8), 0 0 60px rgba(255,214,10,.3); opacity: 0; }
  #ask { position: absolute; left: 0; right: 0; top: 614px; text-align: center; font-size: 32px; color: #c9d1de; opacity: 0; }
  #payoff { position: absolute; left: 90px; right: 90px; top: 1424px; height: 170px; padding: 0 34px; border-radius: 22px;
            background: #07090dee; box-shadow: inset 8px 0 0 #ffd60a, 0 0 0 3px #223049; color: #fff; line-height: 1.15; opacity: 0; }
</style>
</head>
<body>
<div id="stage">
  <div id="grid"></div><div id="vig"></div>
  <svg id="grain" width="1160" height="2000"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
  <div id="world">
    <div class="chip" id="sport"></div>
    <div id="title" class="anton">GUESS THE <b>PLAYER</b></div>
    <div id="sub" class="mono"></div>
    <div id="file">
      <div id="photo"><svg width="200" height="210" viewBox="0 0 200 210"><circle cx="100" cy="72" r="46" fill="#1f2b40"/>
        <path d="M10 210 C 14 140, 50 122, 100 122 C 150 122, 186 140, 190 210 Z" fill="#1f2b40"/></svg>
        <div class="q anton">?</div><div class="tape mono">CLASSIFIED</div></div>
      <div id="meter"><div class="lbl mono">CLUES USED</div><div class="num anton" id="count"></div><div id="pips"></div></div>
    </div>
    <div id="name" class="fit anton"></div>
    <div id="ask" class="mono">HOW MANY CLUES DID YOU NEED?</div>
    <div id="clues"></div>
    <div id="prompt" class="anton">COMMENT THE MOMENT YOU KNOW</div>
    <div id="payoff" class="fit inter"></div>
  </div>
  <div id="flash"></div>
</div>
<script src="common.js"></script>
<script>
let TL, N, ROWH;
async function setup(tl) {
  await FONTS;
  TL = tl; N = tl.clues.length;
  $("sport").textContent = tl.sport;
  $("sub").textContent = `${N} CLUES · HARDEST FIRST`;
  $("pips").innerHTML = "<i></i>".repeat(N);
  const gap = 12; ROWH = (724 - gap * (N - 1)) / N;
  $("clues").innerHTML = tl.clues.map((c, k) => `<div class="clue" id="c${k}" style="top:${k * (ROWH + gap)}px;height:${ROWH}px">
      <div class="n anton">${k + 1}</div><div class="txt fit inter" id="ct${k}"></div><div class="lock mono">CLUE ${k + 1} · LOCKED</div></div>`).join("");
  // every clue at one size (the largest at which all fit); the full text decides the layout, then its letters are
  // revealed in place, so nothing reflows while a clue types in
  const size = Math.min(...tl.clues.map((c, k) => fit($("ct" + k), c, N === 5 ? 54 : 58, 30)));
  tl.clues.forEach((c, k) => {
    const el = $("ct" + k);
    fit(el, c, size, size);
    el.firstChild.innerHTML = [...c].map((ch) => `<i>${esc(ch)}</i>`).join("");
  });
  fit($("name"), tl.answer.toUpperCase(), 170, 70);
  fit($("payoff"), tl.payoff, 58, 32);
}

function render(t) {
  const T = TL.t, R = T.reveal, x = t - R;
  grain(t);
  $("grid").style.transform = `translate(${(t * 18) % 120 - 60}px, ${(t * 10) % 120 - 60}px)`;
  // camera: a slow push-in; a shake as the reveal nears; a kick on the reveal
  const shake = t > R - 0.7 && t < R ? (t - (R - 0.7)) * 9 : 0;
  const kick = x > 0 ? 0.05 * Math.exp(-6 * x) : 0;
  $("world").style.transform = `scale(${1 + 0.02 * clamp(t / R) + kick}) translate(${Math.sin(t * 61) * shake}px, ${Math.cos(t * 47) * shake}px)`;
  // the title slams in
  const p0 = spring(t, 8, 12);
  $("title").style.transform = `scale(${1.6 - 0.6 * p0})`; $("title").style.opacity = clamp(t / 0.1);
  $("sport").style.opacity = $("sub").style.opacity = clamp((t - 0.25) / 0.2);
  $("file").style.opacity = clamp((t - 0.35) / 0.2) * (x > 0 ? clamp(1 - x / 0.12) : 1);
  $("file").style.transform = `translateY(${(1 - ease((t - 0.35) / 0.4)) * 60}px)`;
  // clues: each slides in, types, then dims as the next arrives
  let used = 0;
  TL.clues.forEach((c, k) => {
    const el = $("c" + k), y = t - T.clues[k], on = y >= 0;
    if (on) used = k + 1;
    el.classList.toggle("on", on);
    el.classList.toggle("new", on && (k === N - 1 || t < T.clues[k + 1]) && x < 0);
    el.querySelector(".lock").style.opacity = on ? 0 : 0.9;
    el.style.opacity = clamp((t - 0.45 - k * 0.06) / 0.2) * (on ? 1 : 0.7);
    const p = spring(y, 9, 12);
    el.style.transform = on ? `translateX(${(1 - p) * 140}px) scale(${1 + 0.04 * Math.exp(-6 * y) * Math.cos(12 * y)})` : "none";
    const chars = el.querySelectorAll(".txt i"), shown = Math.floor(clamp((y - 0.05) / 0.45) * chars.length);
    chars.forEach((ch, j) => ch.style.opacity = j < shown ? 1 : 0);
    const old = on && x < 0 && k < used - 1;
    el.querySelector(".txt").style.color = old ? "#aab4c6" : "#f4f1ea";
    // on the reveal, every clue flashes yellow, top to bottom
    const sw = x - 0.15 - k * 0.08;
    el.style.boxShadow = x > 0 && sw > 0 && sw < 0.35 ? "inset 0 0 0 6px #ffd60a, 0 0 50px rgba(255,214,10,.4)" : "";
  });
  $("count").innerHTML = `<b>${used}</b> / ${N}`;
  [...$("pips").children].forEach((el, k) => {
    el.classList.toggle("on", k < used);
    const y = t - T.clues[k];
    el.style.transform = y >= 0 && y < 0.5 ? `scaleY(${1 + 0.5 * Math.exp(-7 * y)})` : "none";
  });
  const pr = $("prompt");
  pr.style.opacity = clamp((t - T.clues[0] - 0.4) / 0.2) * (x > 0 ? clamp(1 - x / 0.1) : 1);
  pr.style.transform = `translateX(-50%) scale(${1 + 0.04 * Math.sin(t * 7)})`;
  // the name slams in where the file was; the payoff replaces the prompt
  const nm = $("name"), q = spring(x, 9, 13);
  nm.style.opacity = x < 0 ? 0 : clamp(x / 0.05);
  nm.style.transform = `rotate(${-3 * (1 - q)}deg) scale(${2.4 - 1.4 * q})`;
  $("ask").style.opacity = clamp((x - 0.6) / 0.25);
  const pay = $("payoff"), y2 = t - T.payoff;
  pay.style.opacity = clamp(y2 / 0.2);
  pay.style.transform = `translateY(${(1 - ease(y2 / 0.35)) * 50}px)`;
  $("flash").style.opacity = x >= 0 ? Math.max(0, 0.8 - x * 3.5) : 0;
}
</script>
</body>
</html>
